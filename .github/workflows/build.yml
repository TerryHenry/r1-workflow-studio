# Builds the desktop apps. Run it from the Actions tab ("Run workflow", choose the platform), or push a tag like v1.0.0 to build both and
# attach the files to that tag's release. The apps are not code-signed (that needs paid Apple and Windows certificates), so macOS and
# Windows show a one-time warning on first open: see the README. Building Windows on a Windows runner is what puts the app's icon on the .exe.
name: Build desktop apps
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "What to build"
        type: choice
        options: [both, windows, mac]
        default: both
      release_tag:
        description: "Attach the files to this release (for example v1.0.0), replacing files with the same names. Empty: only keep them as workflow artifacts"
        type: string
        default: ""
  push:
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ inputs.platforms || 'both' }}
        run: |
          mac='{"os":"macos-latest","flag":"--mac","name":"mac"}'
          win='{"os":"windows-latest","flag":"--win","name":"windows"}'
          case "$CHOICE" in
            windows) list="$win" ;;
            mac) list="$mac" ;;
            *) list="$mac,$win" ;;
          esac
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
  build:
    needs: [test, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach to the release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist-app/*.dmg dist-app/*.zip dist-app/*.exe)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --draft --title "R1 Workflow Studio ${TAG#v}" --notes "Unsigned builds. See the README for the one-time warning on first open." --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: R1-Workflow-Studio-${{ matrix.name }}
          path: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.exe
          if-no-files-found: error
